name: paid-run

# The ONLY workflow that sees ANTHROPIC_API_KEY. Manual trigger only: no pull_request and no
# pull_request_target trigger here, ever. The workflow file must be on the default branch for
# GitHub to allow a dispatch; pick the branch to run it from in "Use workflow from".
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Test 1 (retail): 1 or 2. Test 2 (banking_knowledge): b1, b2 or b3"
        type: choice
        options: ["1", "2", "b1", "b2", "b3"]
        default: "1"
      founder_go:
        description: "Test 1 phase 2: type phase2. Test 2 b2 or b3: type b2 or b3 (the same word)"
        default: ""
      phase1_run_id:
        description: "Phase 2 only: run id of the phase 1 dispatch whose traces are reused"
        default: "39998961720"
      banking_b1_run_id:
        description: "Test 2 b2 only: run id of the b1 dispatch whose traces are reused"
        default: "40019775854"
      allow_no_reuse:
        description: "Test 2 b2 only: go on even if the b1 traces could not be downloaded"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: paid-runs
  cancel-in-progress: false

jobs:
  run:
    # Test 1 (retail): phases 1 and 2, ledger on the `spend` branch, $27 cap. Unchanged.
    if: ${{ !startsWith(inputs.phase, 'b') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PHASE: ${{ inputs.phase }}
      FOUNDER_GO: ${{ inputs.founder_go }}
      DISPATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BRANCH: ${{ github.ref_name }}
      TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: tau2-bench at the pinned commit
        run: |
          git clone --quiet https://github.com/sierra-research/tau2-bench .tau2-bench
          git -C .tau2-bench checkout --quiet cc1df47baa1544a34bb8c8e5c4ca72ad223b96a2

      - name: Refuse phase 2 without the founder's go
        if: inputs.phase == '2' && inputs.founder_go != 'phase2'
        run: |
          echo "Phase 2 needs founder_go = phase2"
          exit 1

      - name: Free checks (no key)
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Check out the spend branch (cumulative ledger)
        run: |
          if git ls-remote --exit-code --heads origin spend >/dev/null 2>&1; then
            git fetch --quiet origin spend
            git worktree add -B spend spend-wt FETCH_HEAD
          else
            git worktree add --orphan -b spend spend-wt
          fi

      - name: Download the phase 1 traces (phase 2 reuses those runs)
        if: inputs.phase == '2'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: traces-phase-1-${{ inputs.phase1_run_id }}
          path: traces/phase-1-prior
          run-id: ${{ inputs.phase1_run_id }}
          github-token: ${{ github.token }}

      - name: Dry run estimate (no key, no cost)
        run: uv run costlayer dry-run --phase "$PHASE" --spend-dir spend-wt

      - name: Paid run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$PHASE" = "1" ]; then
            uv run costlayer phase1 --spend-dir spend-wt --dispatch-id "$DISPATCH_ID"
          else
            uv run costlayer phase2 --spend-dir spend-wt --dispatch-id "$DISPATCH_ID" \
              --founder-go "$FOUNDER_GO"
          fi

      - name: Upload sanitized traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-phase-${{ inputs.phase }}-${{ github.run_id }}
          path: traces/phase-${{ inputs.phase }}
          if-no-files-found: ignore

      - name: Commit the ledger to the spend branch
        if: always()
        run: |
          cd spend-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/results/phase-$PHASE/ledger-summary.json" \
            "ledger-summary-$DISPATCH_ID.json" || true
          git add -A
          git diff --cached --quiet || git commit -m "spend: dispatch $DISPATCH_ID"
          git push origin HEAD:spend

      - name: Commit results and report to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results reports
          git diff --cached --quiet || git commit -m "phase $PHASE: results and report"
          git pull --rebase --quiet origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"

  banking:
    # Test 2 (banking_knowledge): phases b1, b2, b3. Own ledger on the `spend2` branch, caps and
    # total from budget.json (committed by the coordinator). Never shares a branch, a cap or a
    # ledger with test 1. b2 and b3 refuse to run without founder_go equal to the phase key, and
    # the runner refuses a phase whose cap is missing from budget.json.
    if: ${{ startsWith(inputs.phase, 'b') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PHASE: ${{ inputs.phase }}
      FOUNDER_GO: ${{ inputs.founder_go }}
      DISPATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BRANCH: ${{ github.ref_name }}
      TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: tau2-bench at the pinned commit
        run: |
          git clone --quiet https://github.com/sierra-research/tau2-bench .tau2-bench
          git -C .tau2-bench checkout --quiet cc1df47baa1544a34bb8c8e5c4ca72ad223b96a2

      - name: Refuse b2 and b3 without the founder's go
        if: (inputs.phase == 'b2' || inputs.phase == 'b3') && inputs.founder_go != inputs.phase
        run: |
          echo "Phase $PHASE needs founder_go = $PHASE"
          exit 1

      - name: BM25 dependency (tau2[knowledge]) is installed
        run: uv run python -c "import rank_bm25"

      - name: Free checks (no key)
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Check out the spend2 branch (cumulative ledger of test 2)
        run: |
          if git ls-remote --exit-code --heads origin spend2 >/dev/null 2>&1; then
            git fetch --quiet origin spend2
            git worktree add -B spend2 spend-wt FETCH_HEAD
          else
            git worktree add --orphan -b spend2 spend-wt
          fi

      - name: Phase number for the folders (b1 -> 1, b2 -> 2)
        run: echo "N=${PHASE#b}" >> "$GITHUB_ENV"

      - name: Download the b1 traces (b2 reuses those runs)
        if: inputs.phase == 'b2'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: traces-banking-b1-${{ inputs.banking_b1_run_id }}
          path: traces/banking-b1-prior
          run-id: ${{ inputs.banking_b1_run_id }}
          github-token: ${{ github.token }}

      - name: Dry run estimate (no key, no cost)
        run: |
          uv run costlayer banking-dry-run --phase "$PHASE" --founder-go "$FOUNDER_GO" \
            --budget budget.json --spend-dir spend-wt \
            --prior-runs results/banking-phase-1/runs --prior-traces traces/banking-b1-prior \
            ${{ inputs.allow_no_reuse && '--allow-no-reuse' || '' }}

      - name: Paid run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run costlayer banking-phase --phase "$PHASE" --founder-go "$FOUNDER_GO" \
            --budget budget.json --spend-dir spend-wt --dispatch-id "$DISPATCH_ID" \
            --prior-runs results/banking-phase-1/runs --prior-traces traces/banking-b1-prior \
            ${{ inputs.allow_no_reuse && '--allow-no-reuse' || '' }}

      - name: Upload sanitized traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-banking-${{ inputs.phase }}-${{ github.run_id }}
          path: traces/banking-phase-${{ env.N }}
          if-no-files-found: ignore

      - name: Commit the ledger to the spend2 branch
        if: always()
        run: |
          cd spend-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/results/banking-phase-$N/ledger-summary.json" \
            "ledger-summary-$DISPATCH_ID.json" || true
          git add -A
          git diff --cached --quiet || git commit -m "spend2: dispatch $DISPATCH_ID"
          git push origin HEAD:spend2

      - name: Upload the ledger as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-banking-${{ inputs.phase }}-${{ github.run_id }}
          path: spend-wt/ledger-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          if-no-files-found: ignore

      - name: Commit results and report to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results reports
          git diff --cached --quiet || git commit -m "banking $PHASE: results and report"
          git pull --rebase --quiet origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"
