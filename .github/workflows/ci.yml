name: ci

# No secrets here: lint and free tests only (fake Anthropic client, no network).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: tau2-bench at the pinned commit (data files only are used)
        run: |
          git clone --quiet https://github.com/sierra-research/tau2-bench .tau2-bench
          git -C .tau2-bench checkout --quiet cc1df47baa1544a34bb8c8e5c4ca72ad223b96a2
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
