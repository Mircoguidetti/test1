[project]
name = "costlayer"
version = "0.1.0"
description = "Agent cost layer experiment on tau-bench"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2",
    "tau2[knowledge]",
    "audioop-lts>=0.2; python_version >= '3.13'",  # tau2 imports audioop, removed in 3.13
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyyaml>=6"]

[tool.uv.sources]
# tau2-bench (tau^3-bench v1.0.0, MIT license), pinned commit.
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "cc1df47baa1544a34bb8c8e5c4ca72ad223b96a2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["costlayer"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
costlayer = "costlayer.cli:main"

[tool.ruff.lint.per-file-ignores]
# Markdown report text: long string literals are easier to read unwrapped.
"costlayer/report_banking.py" = ["E501"]
"costlayer/optimizer/failure_anatomy.py" = ["E501"]
"costlayer/optimizer/cps_report.py" = ["E501"]
